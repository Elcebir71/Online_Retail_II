apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  labels:
    app.kubernetes.io/name: churn-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: churn-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: churn-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # appuser created in the Dockerfile
      containers:
        - name: churn-api
          image: ghcr.io/elcebir71/online-retail-churn:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/model
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # The model is loaded at startup, so allow some time before the first probe
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          # Prediction log for drift monitoring. emptyDir lives as long as the pod; in production,
          # use a PersistentVolumeClaim or ship stdout/files to a log store instead.
          volumeMounts:
            - name: prediction-logs
              mountPath: /app/logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: prediction-logs
          emptyDir: {}
